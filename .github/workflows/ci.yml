name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and test
        run: mvn -B -ntp clean verify
      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: lulu-mart.war
          path: target/lulu-mart.war